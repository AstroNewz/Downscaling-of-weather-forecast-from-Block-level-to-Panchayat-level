version: '3.8'

services:
  # PostGIS spatial database for panchayat geometries, land-use masks, and weather grid rasters
  postgis:
    image: postgis/postgis:16-3.4
    container_name: agri_weather_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agri_weather_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agri_weather_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Agro-Meteorological Advisory Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_weather_api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgis:5432/${POSTGRES_DB:-agri_weather_db}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  postgis_data:
    driver: local
